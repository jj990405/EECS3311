<text x="1137" y="923" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">+ instruction(): String</text>
<text x="1137" y="946" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">+ forDifficulty(Difficulty): ExplanationStrategy</text>
<text x="1137" y="969" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">Returns HIGH / MEDIUM / LOW lambdas.</text>
<text x="45" y="1116" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">HttpLlmClient adapts the application interface to an OpenAI-compatible HTTPS endpoint; .env remains local and ignored by Git.</text>
<text x="45" y="1141" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">answerQuestion() checks cited file/page pairs against supplied passages. Notes track source pages in the controller.</text>
