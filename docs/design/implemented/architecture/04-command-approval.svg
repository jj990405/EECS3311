<text x="45" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">Commands and explicit approval</text>
<text x="45" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569">Pending proposals are transient. Direct manual edits use DataStore; AI data-changing proposals use commands.</text>
