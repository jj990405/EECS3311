<text x="827" y="788" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">DeleteDeadlineCommand  &lt;&lt;record&gt;&gt;</text>
<text x="827" y="833" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">store: DataStore; id: UUID</text>
