<text x="57" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">+ approveProposal(id)</text>
<text x="57" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">+ rejectProposal(id)</text>
<text x="57" y="279" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">+ reviseSyllabusCandidate(...)</text>
<text x="57" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">+ planScheduleChange(...)</text>
<rect x="555" y="160" width="440" height="207" fill="white" stroke="#64748b" stroke-width="1.5"/>
