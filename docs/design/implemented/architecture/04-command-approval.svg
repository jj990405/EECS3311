<text x="1212" y="899" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">+ execute() -&gt; assignLectureWeek(...)</text>
<text x="45" y="1046" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">Proposal is CommandInvoker.Proposal(id, description), a nested record; command objects live in a separate map.</text>
<text x="45" y="1071" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">Essay-score approval uses an AgentCommand lambda in AgentController.proposeEssayGrade(); no UpdateGradeCommand class exists.</text>
