<text x="567" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">CommandInvoker</text>
<text x="567" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">- commands: Map&lt;UUID, AgentCommand&gt;</text>
<text x="567" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">- descriptions: Map&lt;UUID, Proposal&gt;</text>
<path d="M555,268 H995" stroke="#cbd5e1"/>
<text x="567" y="299" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">+ propose(description, command): Proposal</text>
<text x="567" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">+ replace(...) / pending() / clear()</text>
<text x="567" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">+ approve(id) / reject(id)</text>
<rect x="1115" y="160" width="440" height="95" fill="white" stroke="#64748b" stroke-width="1.5"/>
