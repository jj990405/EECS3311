<text x="57" y="528" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">+ plan(store, llm, prompts, parser, invoker,</text>
<text x="57" y="551" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">       courseId, request): Proposal</text>
<text x="57" y="574" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">Validates target course and requested action.</text>
