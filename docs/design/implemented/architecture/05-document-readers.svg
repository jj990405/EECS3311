<text x="602" y="868" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">OfficeXmlReader  &lt;&lt;package utility&gt;&gt;</text>
<text x="602" y="913" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">~ paragraphs(InputStream): String</text>
<text x="602" y="936" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">Secure XML parsing; extracts visible text.</text>
<text x="45" y="1021" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">Unsupported formats remain stored and openable; they have no document reader and cannot provide AI text evidence.</text>
