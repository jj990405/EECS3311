<polygon points="650,675 657.0,671.0 664.0,675.0 657.0,679.0" fill="#334155"/>
<text x="730.0" y="669.0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569">children: 0..*</text>
<rect x="45" y="160" width="400" height="95" fill="white" stroke="#64748b" stroke-width="1.5"/>
<rect x="46" y="161" width="398" height="43" fill="#dbeafe"/>
<path d="M45,204 H445" stroke="#64748b"/>
<text x="57" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">AgentController</text>
<text x="57" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">+ workspace(): List&lt;WorkspaceNode&gt;</text>
<rect x="560" y="160" width="440" height="118" fill="white" stroke="#64748b" stroke-width="1.5"/>
<rect x="561" y="161" width="438" height="43" fill="#f3f4f6"/>
<path d="M560,204 H1000" stroke="#64748b"/>
<text x="572" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">WorkspaceTree</text>
<text x="572" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">+ build(DataStore): List&lt;WorkspaceNode&gt;</text>
<text x="572" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">Builds semester -&gt; course -&gt; category -&gt; file.</text>
<rect x="1110" y="160" width="440" height="118" fill="white" stroke="#64748b" stroke-width="1.5"/>
<rect x="1111" y="161" width="438" height="43" fill="#f3f4f6"/>
<path d="M1110,204 H1550" stroke="#64748b"/>
<text x="1122" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">WorkspaceNode  &lt;&lt;sealed interface&gt;&gt;</text>
<text x="1122" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">+ label(): String</text>
<text x="1122" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">+ children(): List&lt;WorkspaceNode&gt;</text>
<rect x="120" y="590" width="530" height="184" fill="white" stroke="#64748b" stroke-width="1.5"/>
<rect x="121" y="591" width="528" height="43" fill="#edf4ed"/>
<path d="M120,634 H650" stroke="#64748b"/>
<text x="132" y="618" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">WorkspaceBranch  &lt;&lt;record / Composite&gt;&gt;</text>
<text x="132" y="663" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">label: String; kind: Kind; id: UUID</text>
<text x="132" y="686" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">children: List&lt;WorkspaceNode&gt;</text>
<text x="132" y="709" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">Kind = SEMESTER | COURSE | CATEGORY</text>
<path d="M120,721 H650" stroke="#cbd5e1"/>
<text x="132" y="752" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">+ label() / children()</text>
<rect x="950" y="590" width="530" height="161" fill="white" stroke="#64748b" stroke-width="1.5"/>
<rect x="951" y="591" width="528" height="43" fill="#edf4ed"/>
<path d="M950,634 H1480" stroke="#64748b"/>
<text x="962" y="618" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">WorkspaceLeaf  &lt;&lt;record / Leaf&gt;&gt;</text>
<text x="962" y="663" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">file: MaterialFile</text>
<path d="M950,675 H1480" stroke="#cbd5e1"/>
<text x="962" y="706" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">+ label(): String</text>
<text x="962" y="729" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a">+ children(): List&lt;WorkspaceNode&gt; = empty</text>
<text x="120" y="941" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">Branches copy their children list. A category branch is a WorkspaceBranch value, not a separate CategoryFolder class.</text>
<text x="120" y="966" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">WorkspaceTree is a view projection of DataStore records; the persisted domain model itself is not this tree.</text>
<text x="45" y="1013" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b">EECS3311 / Implementation diagrams / 2026-11-13 / Selected members; consult source for full signatures.</text>
</svg>