<text x="507.5" y="209.0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569">calls build</text>
<path d="M1000,215 L1110,215" stroke="#334155" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="1060.0" y="209.0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569">returns roots</text>
<path d="M385,590 L385,440 L1250,440 L1250,278" stroke="#334155" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#triangle)"/>
<text x="390.0" y="509.0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569">implements</text>
<path d="M1215,590 L1215,510 L1415,510 L1415,278" stroke="#334155" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#triangle)"/>
<text x="1220.0" y="544.0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569">implements</text>
