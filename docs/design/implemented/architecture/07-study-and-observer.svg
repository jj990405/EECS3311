<text x="600" y="1126" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">Nested artifact records: Summary, Question, Quiz, Attempt,</text>
<text x="600" y="1151" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">EssayPrompt, EssayGrade, SelfAssessment.</text>
<text x="600" y="1176" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">MCQ grading is deterministic in StudyArtifacts.grade().</text>
<text x="600" y="1201" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">AI essay scores become saved grades only after approval.</text>
