<text x="48" y="1718" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#1e3146">Raw extraction keeps every page. After upload, image-assisted reading may send page images to the configured API; labelled results and a complete index stay local. Cached preparation is reused. No 1,500-character prefix</text>
<text x="48" y="1741" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#1e3146">limit. Local originals stay unchanged; calendar/grade mutations still need approval. Lecture-week matching is separate (SD01b).</text>
