<text x="48" y="1387" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#1e3146">GUI uses a navigator, wrapping choices, progress and read-only review; cancel saves no attempt. Selected-slide MCQs are available from PDF/file menus and CLI pages scope. Cover/outline-only</text>
<text x="48" y="1410" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#1e3146">input may be rejected for insufficient concepts. Grading compares stored keys, not pedagogical truth. Multi-file metadata records the first material; essay scope remains file/week/all (SD10b).</text>
