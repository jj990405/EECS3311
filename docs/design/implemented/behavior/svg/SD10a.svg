<text x="48" y="1407" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#1e3146">Unassigned lecture weeks offer file selection instead of blocking. Whole-file/week/all scopes read all prepared pages, including image readings; very long scopes use source-fact batches.</text>
<text x="48" y="1430" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#1e3146">Selected-slide scope stays explicit. A true cover-only page can still be insufficient. Grading compares saved keys, not pedagogical truth. Multi-file metadata retains the first material.</text>
